worker_processes  1;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_max_body_size 50M;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Résolution DNS dynamique (résout le 502 récurrent) ──────────────────
    # Les blocs `upstream` statiques figent l'IP du conteneur au démarrage de
    # nginx : recréer un service (docker compose up -d --no-deps X) changeait
    # son IP et cassait la passerelle jusqu'à `docker restart xpark-nginx`.
    # Avec le résolveur interne de Docker (127.0.0.11) et des variables dans
    # proxy_pass, nginx re-résout le nom à chaque requête (cache 10 s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /iam/ {
      set $svc_iam iam-api;
      rewrite ^/iam/(.*) /$1 break;
      proxy_pass http://$svc_iam;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /fleet/ {
      set $svc_fleet fleet-api;
      rewrite ^/fleet/(.*) /$1 break;
      proxy_pass http://$svc_fleet;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mission/ {
      set $svc_mission mission-api;
      rewrite ^/mission/(.*) /$1 break;
      proxy_pass http://$svc_mission;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /maintenance/ {
      set $svc_maintenance maintenance-api;
      rewrite ^/maintenance/(.*) /$1 break;
      proxy_pass http://$svc_maintenance;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /finance/ {
      set $svc_finance finance-api;
      rewrite ^/finance/(.*) /$1 break;
      proxy_pass http://$svc_finance;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /alerts/ {
      set $svc_alerts alerts-api;
      rewrite ^/alerts/(.*) /$1 break;
      proxy_pass http://$svc_alerts;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chat.API — REST + SignalR WebSocket
    location /chat/ {
      set $svc_chat chat-api;
      rewrite ^/chat/(.*) /$1 break;
      proxy_pass http://$svc_chat;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_cache_bypass $http_upgrade;
    }

    location /backend/ {
      set $svc_backend backend;
      rewrite ^/backend/(.*) /$1 break;
      proxy_pass http://$svc_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_cache_bypass $http_upgrade;
    }

    # Healthcheck
    location /health {
      return 200 'OK';
    }
  }
}
