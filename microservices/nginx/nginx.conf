worker_processes  1;
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  client_max_body_size 50M;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream iam {
    server iam-api:80;
  }
  upstream fleet {
    server fleet-api:80;
  }
  upstream mission {
    server mission-api:80;
  }
  upstream maintenance {
    server maintenance-api:80;
  }
  upstream finance {
    server finance-api:80;
  }
  upstream alerts {
    server alerts-api:80;
  }
  upstream backend {
    server backend:80;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location /iam/ {
      proxy_pass http://iam/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /fleet/ {
      proxy_pass http://fleet/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mission/ {
      proxy_pass http://mission/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /maintenance/ {
      proxy_pass http://maintenance/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /finance/ {
      proxy_pass http://finance/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /alerts/ {
      proxy_pass http://alerts/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /backend/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_cache_bypass $http_upgrade;
    }

    # Healthcheck
    location /health {
      return 200 'OK';
    }
  }
}
