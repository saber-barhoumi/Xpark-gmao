server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    # text/html est toujours compressé par nginx : le déclarer ici produit un
    # avertissement « duplicate MIME type » à chaque démarrage.
    gzip_types
        application/javascript
        text/css
        application/json
        image/svg+xml;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Résolution DNS dynamique de la passerelle ────────────────────
    # `proxy_pass http://nginx:80/…` figeait l'IP de la passerelle au démarrage
    # de ce nginx. Recréer xpark-nginx lui donne une nouvelle IP : le back-office
    # continuait alors d'interroger l'ancienne et TOUTE l'API répondait 404,
    # jusqu'à redémarrer aussi ce conteneur. Avec le résolveur interne de Docker
    # et une variable dans proxy_pass, le nom est résolu à chaque requête
    # (cache 10 s). Même correctif que la passerelle
    # (microservices/nginx/nginx.conf).
    #
    # Une variable dans proxy_pass désactive la réécriture automatique du préfixe
    # de location : chaque bloc porte donc un `rewrite ... break` explicite.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $passerelle nginx;

    # ── IAM Service routes (/auth, /users, /employees, /clients) ──
    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /iam/api/auth/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/user-management/ {
        rewrite ^/api/user-management/(.*)$ /iam/api/user-management/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/users/ {
        rewrite ^/api/users/(.*)$ /iam/api/users/$1 break;
        proxy_pass http://$passerelle;
        client_max_body_size 50M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/employees/ {
        rewrite ^/api/employees/(.*)$ /iam/api/employees/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/clients/ {
        rewrite ^/api/clients/(.*)$ /iam/api/clients/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/kpi/ {
        rewrite ^/api/kpi/(.*)$ /iam/api/kpi/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fleet Service routes (/vehicules, /equipements, /carburants, /sources) ──
    location /api/vehicules/ {
        rewrite ^/api/vehicules/(.*)$ /fleet/api/vehicules/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/equipements/ {
        rewrite ^/api/equipements/(.*)$ /fleet/api/equipements/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/carburants/ {
        rewrite ^/api/carburants/(.*)$ /fleet/api/carburants/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/sources/ {
        rewrite ^/api/sources/(.*)$ /fleet/api/sources/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/documents-administratifs/ {
        rewrite ^/api/documents\-administratifs/(.*)$ /fleet/api/documents/$1 break;
        proxy_pass http://$passerelle;
        client_max_body_size 50M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/assurances/ {
        rewrite ^/api/assurances/(.*)$ /fleet/api/assurances/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Échéances de flotte (assurances + documents) — source du calendrier métier
    location /api/echeances/ {
        rewrite ^/api/echeances/(.*)$ /fleet/api/echeances/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PredictionPanne — maintenance prédictive (module PredictionPanne)
    location /api/predictions/ {
        rewrite ^/api/predictions/(.*)$ /prediction/api/predictions/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Mission Service routes (/missions) ────────────────────────
    location /api/missions/ {
        rewrite ^/api/missions/(.*)$ /mission/api/missions/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Lecture assistée des documents (OCR) ──────────────────────
    # Le fichier transite par le serveur : la clé du fournisseur reste
    # côté serveur et n'est jamais envoyée au navigateur.
    location /api/ocr/ {
        rewrite ^/api/ocr/(.*)$ /ocr/$1 break;
        proxy_pass http://$passerelle;
        client_max_body_size 25M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Maintenance Service routes ────────────────────────────────
    location /api/interventions/ {
        rewrite ^/api/interventions/(.*)$ /maintenance/api/interventions/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ordres-travail/ {
        rewrite ^/api/ordres\-travail/(.*)$ /maintenance/api/ordres-travail/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/pieces-rechange/ {
        rewrite ^/api/pieces\-rechange/(.*)$ /maintenance/api/pieces-rechange/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/piecesrechange/ {
        rewrite ^/api/piecesrechange/(.*)$ /maintenance/api/pieces-rechange/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Finance Service routes (/factures) ────────────────────────
    location /api/factures/ {
        rewrite ^/api/factures/(.*)$ /finance/api/factures/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Alerts Service routes (/alertes) ──────────────────────────
    location /api/alertes/ {
        rewrite ^/api/alertes/(.*)$ /alerts/api/alertes/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Chat REST API (Chat.API microservice) ─────────────────────
    location /api/chat/ {
        rewrite ^/api/chat/(.*)$ /chat/api/chat/$1 break;
        proxy_pass http://$passerelle;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SignalR chatHub (Chat.API microservice) ───────────────────
    location /chatHub {
        rewrite ^/chatHub(.*)$ /chat/chatHub$1 break;
        proxy_pass http://$passerelle;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /kanbanHub {
        rewrite ^/kanbanHub(.*)$ /backend/kanbanHub$1 break;
        proxy_pass http://$passerelle;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Fichiers uploadés (avatars, pièces jointes) — volume ./data/uploads ──
    # Sans cette location, /uploads/x.jpg tombait dans le fallback SPA et
    # renvoyait index.html (HTTP 200 mais image cassée).
    location /uploads/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Static Assets with Aggressive Caching ─────────────────────
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health Check ──────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # ── SPA Fallback (must be last) ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
