global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "xpark-health"
    metrics_path: /health
    static_configs:
      - targets:
          - iam-api:80
          - fleet-api:80
          - mission-api:80
          - maintenance-api:80
          - finance-api:80
          - alerts-api:80
          - chat-api:80
          - prediction-api:80
          - nginx:80

  - job_name: "xpark-ayshaa"
    metrics_path: /metrics
    static_configs:
      - targets:
          - ayshaa-rag:8010

  - job_name: "xpark-prometheus"
    static_configs:
      - targets:
          - localhost:9090
