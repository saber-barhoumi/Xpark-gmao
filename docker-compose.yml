# ============================================================
# XPARK GMAO – Microservices Docker Compose
# All services share the same PostgreSQL database (xpark_gmao)
# so the frontend continues to work while microservices are active.
# The monolith (backend) manages EF migrations.
# ============================================================

services:

  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xpark-postgres
    environment:
      POSTGRES_USER: xpark_user
      POSTGRES_PASSWORD: xpark_password_2026
      POSTGRES_DB: xpark_gmao
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpark_user -d xpark_gmao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xpark-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: xpark-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: xpark
      RABBITMQ_DEFAULT_PASS: xpark_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - xpark-network
    restart: unless-stopped

  # ── IAM Service (Auth + Users + Employees) ─────────────────────
  iam-api:
    build:
      context: ./microservices
      dockerfile: IAM/IAM.API/Dockerfile
    container_name: xpark-iam-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      # ── Envoi d'emails REEL (confirmation, reset, OTP MFA) ──────────
      # Valeurs chargees depuis le fichier .env (non committe). Voir .env.example.
      # Sans .env, les variables sont vides -> l'email ne part pas mais le code
      # est journalise en mode DEV (docker logs xpark-iam-api).
      - Email__Host=${EMAIL_HOST:-smtp.gmail.com}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__Username=${EMAIL_USERNAME:-}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__From=${EMAIL_FROM:-XPARK GMAO <noreply@xpark.tn>}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5001:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Fleet Service (Vehicules + Sources + Carburants) ───────────
  fleet-api:
    build:
      context: ./microservices
      dockerfile: Fleet/Fleet.API/Dockerfile
    container_name: xpark-fleet-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5002:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Mission Service ─────────────────────────────────────────────
  mission-api:
    build:
      context: ./microservices
      dockerfile: Mission/Mission.API/Dockerfile
    container_name: xpark-mission-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5003:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Maintenance Service ─────────────────────────────────────────
  maintenance-api:
    build:
      context: ./microservices
      dockerfile: Maintenance/Maintenance.API/Dockerfile
    container_name: xpark-maintenance-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5004:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Finance Service ─────────────────────────────────────────────
  finance-api:
    build:
      context: ./microservices
      dockerfile: Finance/Finance.API/Dockerfile
    container_name: xpark-finance-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5005:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Alerts Service ──────────────────────────────────────────────
  alerts-api:
    build:
      context: ./microservices
      dockerfile: Alerts/Alerts.API/Dockerfile
    container_name: xpark-alerts-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5006:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Chat Service (SignalR chatHub + REST /api/chat/) ───────────
  chat-api:
    build:
      context: ./microservices
      dockerfile: Chat.API/Dockerfile
    container_name: xpark-chat-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - Jwt__Key=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=xpark_secret
    ports:
      - "5007:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Monolith Backend (SignalR hubs: kanbanHub only) ─────────────
  backend:
    build:
      context: ./backend/src
      dockerfile: XparkGMAO.API/Dockerfile
    container_name: xpark-backend
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=xpark_password_2026
      - JwtSettings__Secret=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - JwtSettings__Issuer=XparkGMAO
      - JwtSettings__Audience=XparkGMAO
    ports:
      - "5000:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── NGINX API Gateway ───────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: xpark-nginx
    ports:
      - "8080:80"
    volumes:
      - ./microservices/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - iam-api
      - fleet-api
      - mission-api
      - maintenance-api
      - finance-api
      - alerts-api
      - chat-api
      - backend
    networks:
      - xpark-network
    restart: unless-stopped

  # ── AI Trip Price Predictor (FastAPI + XGBoost) ─────────────────
  ai-predictor:
    build:
      context: ./CalculateurPrixTrajetIA
      dockerfile: Dockerfile
    container_name: xpark-ai-predictor
    ports:
      - "8000:8000"
    networks:
      - xpark-network
    restart: unless-stopped

  # ── AI Fleet Optimizer (FastAPI — Greedy + GA + Local Search) ───
  # Event-driven: consumes xpark.missions.ready-for-optimization,
  # publishes xpark.optimization.plan-generated (exchange topic `xpark.ai`)
  ai-optimizer:
    build:
      context: ./OptimisateurFlotteIA
      dockerfile: Dockerfile
    container_name: xpark-ai-optimizer
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=xpark
      - RABBITMQ_PASS=xpark_secret
    ports:
      - "8001:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Intelligent Business Owner Assistant (IBOA) ─────────────────
  # Monitoring temps réel : consomme xpark.# sur l'exchange xpark.ai,
  # score la criticité, alerte WhatsApp/Email, rapports PDF/Excel.
  # Sans TWILIO_*/SMTP_* les envois sont simulés (journalisés).
  iboa:
    build:
      context: ./IntelligentBusinessOwnerAssistant
      dockerfile: Dockerfile
    container_name: xpark-iboa
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=xpark
      - RABBITMQ_PASS=xpark_secret
      - DATABASE_URL=host=postgres port=5432 dbname=xpark_gmao user=xpark_user password=xpark_password_2026
      # Envoi réel WhatsApp (optionnel) :
      # - TWILIO_ACCOUNT_SID=ACxxxxxxxx
      # - TWILIO_AUTH_TOKEN=xxxxxxxx
      # - TWILIO_WHATSAPP_FROM=whatsapp:+14155238886
      # Envoi réel Email (optionnel) :
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=xxxx@gmail.com
      # - SMTP_PASS=app-password
      # - SMTP_FROM=iboa@xpark.tn
    ports:
      - "5008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Backoffice Admin Frontend ───────────────────────────────────
  backoffice:
    build:
      context: ./frontend/backoffice
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_AI_API_URL=http://localhost:8000
        - VITE_OPTIMIZER_API_URL=http://localhost:8001
        - VITE_IBOA_API_URL=http://localhost:5008
    container_name: xpark-backoffice
    ports:
      - "3000:80"
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - nginx
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Frontoffice Public Frontend ─────────────────────────────────
  frontoffice:
    build:
      context: ./frontend/frontoffice
      dockerfile: Dockerfile
      args:
        # IAM.API direct (auth + MFA espace client)
        - NEXT_PUBLIC_API_URL=http://localhost:5001/api
        # CalculateurPrixTrajetIA (villes, distances, estimation prix)
        - NEXT_PUBLIC_AI_API_URL=http://localhost:8000
        # Mission.API direct (reservations + suivi missions client)
        - NEXT_PUBLIC_MISSION_API_URL=http://localhost:5003/api
    container_name: xpark-frontoffice
    ports:
      - "3001:3000"
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Ayshaa RAG — assistante virtuelle du site vitrine ───────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: xpark-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - xpark-network
    restart: unless-stopped

  ayshaa-rag:
    build:
      context: ./AyshaaRAG
      dockerfile: Dockerfile
    container_name: xpark-ayshaa-rag
    ports:
      - "8010:8010"
    environment:
      - AYSHAA_QDRANT_URL=http://qdrant:6333
      - AYSHAA_OLLAMA_URL=http://ollama:11434
      - AYSHAA_LLM_ENABLED=true
      - AYSHAA_MEMORY_DB=/data/ayshaa_memory.db
      - AYSHAA_DATA_DIR=/data
      - AYSHAA_ADMIN_API_KEY=${AYSHAA_ADMIN_API_KEY:-dev-only-key}
      - AYSHAA_CORS_ORIGINS=["http://localhost:3001","http://localhost:8080"]
    volumes:
      - ayshaa-data:/data
    depends_on:
      - qdrant
    networks:
      - xpark-network
    restart: unless-stopped

  # LLM local optionnel : docker compose --profile llm up -d ollama
  # puis : docker exec xpark-ollama ollama pull qwen2.5:3b-instruct
  # Sans lui, Ayshaa fonctionne en mode extractif (degradation gracieuse).
  ollama:
    image: ollama/ollama:latest
    container_name: xpark-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - xpark-network
    restart: unless-stopped

networks:
  xpark-network:
    driver: bridge

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  qdrant-data: {}
  ayshaa-data: {}
  ollama-data: {}
