# ============================================================
# XPARK GMAO – Microservices Docker Compose
# All services share the same PostgreSQL database (xpark_gmao)
# so the frontend continues to work while microservices are active.
# The monolith (backend) manages EF migrations.
# ============================================================

services:

  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xpark-postgres
    environment:
      POSTGRES_USER: xpark_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpark_password_2026}
      POSTGRES_DB: xpark_gmao
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpark_user -d xpark_gmao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xpark-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: xpark-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: xpark
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - xpark-network
    restart: unless-stopped

  # ── IAM Service (Auth + Users + Employees) ─────────────────────
  iam-api:
    build:
      context: ./microservices
      dockerfile: IAM/IAM.API/Dockerfile
    container_name: xpark-iam-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      # ── Envoi d'emails REEL (confirmation, reset, OTP MFA) ──────────
      # Valeurs chargees depuis le fichier .env (non committe). Voir .env.example.
      # Sans .env, les variables sont vides -> l'email ne part pas mais le code
      # est journalise en mode DEV (docker logs xpark-iam-api).
      - Email__Host=${EMAIL_HOST:-smtp.gmail.com}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__Username=${EMAIL_USERNAME:-}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__From=${EMAIL_FROM:-XPARK GMAO <noreply@xpark.tn>}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5001:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Fleet Service (Vehicules + Sources + Carburants) ───────────
  fleet-api:
    build:
      context: ./microservices
      dockerfile: Fleet/Fleet.API/Dockerfile
    container_name: xpark-fleet-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5002:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Mission Service ─────────────────────────────────────────────
  mission-api:
    build:
      context: ./microservices
      dockerfile: Mission/Mission.API/Dockerfile
    container_name: xpark-mission-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5003:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Maintenance Service ─────────────────────────────────────────
  maintenance-api:
    build:
      context: ./microservices
      dockerfile: Maintenance/Maintenance.API/Dockerfile
    container_name: xpark-maintenance-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5004:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Finance Service ─────────────────────────────────────────────
  finance-api:
    build:
      context: ./microservices
      dockerfile: Finance/Finance.API/Dockerfile
    container_name: xpark-finance-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5005:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Alerts Service ──────────────────────────────────────────────
  alerts-api:
    build:
      context: ./microservices
      dockerfile: Alerts/Alerts.API/Dockerfile
    container_name: xpark-alerts-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5006:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── PredictionPanne Service (maintenance predictive IA) ────────
  prediction-api:
    build:
      context: ./microservices
      dockerfile: PredictionPanne/PredictionPanne.API/Dockerfile
    container_name: xpark-prediction-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
    ports:
      - "5009:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Chat Service (SignalR chatHub + REST /api/chat/) ───────────
  chat-api:
    build:
      context: ./microservices
      dockerfile: Chat/Chat.API/Dockerfile
    container_name: xpark-chat-api
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=xpark
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-xpark_secret}
    ports:
      - "5007:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Monolith Backend (SignalR hubs: kanbanHub only) ─────────────
  backend:
    build:
      context: ./backend/src
      dockerfile: XparkGMAO.API/Dockerfile
    container_name: xpark-backend
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=xpark_gmao;Username=xpark_user;Password=${POSTGRES_PASSWORD:-xpark_password_2026}
      - JwtSettings__Secret=XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!
      - JwtSettings__Issuer=XparkGMAO
      - JwtSettings__Audience=XparkGMAO
    ports:
      - "5000:80"
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── NGINX API Gateway ───────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: xpark-nginx
    ports:
      - "8080:80"
    volumes:
      - ./microservices/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./microservices/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - iam-api
      - fleet-api
      - mission-api
      - maintenance-api
      - finance-api
      - alerts-api
      - chat-api
      - backend
      - frontoffice
      - ai-predictor
      - ai-optimizer
      - iboa
      - ocr
      - prediction-api
      - ayshaa-rag
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Monitoring stack ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: xpark-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - nginx
      - iam-api
      - fleet-api
      - mission-api
      - maintenance-api
      - finance-api
      - alerts-api
      - chat-api
      - prediction-api
      - ayshaa-rag
    networks:
      - xpark-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: xpark-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    ports:
      - "3005:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - xpark-network
    restart: unless-stopped

  # ── AI Trip Price Predictor (FastAPI + XGBoost) ─────────────────
  ai-predictor:
    build:
      context: ./CalculateurPrixTrajetIA
      dockerfile: Dockerfile
    container_name: xpark-ai-predictor
    ports:
      - "8000:8000"
    networks:
      - xpark-network
    restart: unless-stopped

  # ── AI Fleet Optimizer (FastAPI — Greedy + GA + Local Search) ───
  # Event-driven: consumes xpark.missions.ready-for-optimization,
  # publishes xpark.optimization.plan-generated (exchange topic `xpark.ai`)
  ai-optimizer:
    build:
      context: ./OptimisateurFlotteIA
      dockerfile: Dockerfile
    container_name: xpark-ai-optimizer
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=xpark
      - RABBITMQ_PASS=xpark_secret
    ports:
      - "8001:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Lecteur de documents (OCR assisté) ──────────────────────────
  # Lit cartes grises, assurances, vignettes, visites techniques,
  # permis et reçus de carburant, et en extrait les champs.
  #
  # Ce service existe pour une raison de sécurité : la clé du
  # fournisseur ne doit jamais atteindre le navigateur. Elle était
  # auparavant embarquée dans le paquet JavaScript, donc lisible par
  # quiconque ouvrait les outils de développement.
  ocr:
    build:
      context: ./LecteurDocumentsIA
      dockerfile: Dockerfile
    container_name: xpark-ocr
    environment:
      # Fournisseur : « groq » (api.groq.com, clés « gsk_… ») ou « xai »
      # (api.x.ai, modèle Grok, clés « xai-… »). Les deux noms se
      # ressemblent mais désignent deux services sans rapport : une clé de
      # l'un présentée à l'autre répond 401.
      - OCR_FOURNISSEUR=${OCR_FOURNISSEUR:-groq}
      # Clé du fournisseur — dans le .env de la racine, jamais versionnée.
      - OCR_API_KEY=${OCR_API_KEY:-}
      # Renseigner ces deux-là seulement pour sortir des valeurs par défaut
      # du fournisseur choisi.
      - OCR_API_URL=${OCR_API_URL:-}
      - OCR_VISION_MODEL=${OCR_VISION_MODEL:-}
      # Ancien nom, encore accepté.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Mêmes paramètres de jeton que les services .NET : le service
      # n'accepte que les appels porteurs d'un jeton de session valide.
      - Jwt__Key=${JWT_KEY:-XparkGMAO_SuperSecret_JWT_Key_2024_MustBe32CharsAtLeast!}
      - Jwt__Issuer=XparkGMAO
      - Jwt__Audience=XparkGMAO
    ports:
      - "8002:8002"
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Intelligent Business Owner Assistant (IBOA) ─────────────────
  # Monitoring temps réel : consomme xpark.# sur l'exchange xpark.ai,
  # score la criticité, alerte WhatsApp/Email, rapports PDF/Excel.
  # Sans TWILIO_*/SMTP_* les envois sont simulés (journalisés).
  iboa:
    build:
      context: ./IntelligentBusinessOwnerAssistant
      dockerfile: Dockerfile
    container_name: xpark-iboa
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=xpark
      - RABBITMQ_PASS=xpark_secret
      - DATABASE_URL=host=postgres port=5432 dbname=xpark_gmao user=xpark_user password=xpark_password_2026
      # Envoi réel Email : mêmes identifiants Gmail que le service des
      # identités, pris dans le .env de la racine. Les noms de variables
      # attendus par delivery.py sont SMTP_USER et SMTP_PASS (pas USERNAME
      # ni PASSWORD). Si le .env est absent, les valeurs restent vides et
      # le service retombe de lui-même en simulation.
      - SMTP_HOST=${EMAIL_HOST:-}
      - SMTP_PORT=${EMAIL_PORT:-587}
      - SMTP_USER=${EMAIL_USERNAME:-}
      - SMTP_PASS=${EMAIL_PASSWORD:-}
      # Porte le nom d'affichage : delivery.py n'en garde que l'adresse
      # pour l'expéditeur d'enveloppe.
      - SMTP_FROM=${EMAIL_FROM:-XPARK GMAO <noreply@xpark.tn>}
      # Envoi réel WhatsApp (laissé en simulation) : renseigner ces trois
      # clés dans le .env suffit à l'activer, sans changement de code.
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      # Dashboard URL in IBOA alerts/reports — gateway-relative so it
      # works behind any public domain without hardcoding ngrok URL.
      - IBOA_DASHBOARD_URL=${IBOA_DASHBOARD_URL:-http://localhost:8080/backoffice/monitoring/iboa}
    ports:
      - "5008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Backoffice Admin Frontend ───────────────────────────────────
  backoffice:
    build:
      context: ./frontend/backoffice
      dockerfile: Dockerfile
      args:
        # All URLs are gateway-relative — never localhost or Docker hostnames.
        # These are baked into the Vite JS bundle at build time.
        - VITE_API_URL=/api
        - VITE_AI_API_URL=/ai
        - VITE_OPTIMIZER_API_URL=/optimizer
        - VITE_IBOA_API_URL=/iboa
        - VITE_MISSION_API_URL=/api/missions
    container_name: xpark-backoffice
    ports:
      - "3000:80"
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - nginx
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Frontoffice Public Frontend ─────────────────────────────────
  frontoffice:
    build:
      context: ./frontend/frontoffice
      dockerfile: Dockerfile
      args:
        # Tout passe via le gateway public NGINX sur le host unique
        - NEXT_PUBLIC_API_URL=/iam/api
        - NEXT_PUBLIC_AI_API_URL=/ai
        - NEXT_PUBLIC_MISSION_API_URL=/mission/api
        - NEXT_PUBLIC_FINANCE_API_URL=/finance/api
        - NEXT_PUBLIC_AYSHAA_API_URL=/ayshaa
    container_name: xpark-frontoffice
    ports:
      - "3001:3000"
    networks:
      - xpark-network
    restart: unless-stopped

  # ── Ayshaa RAG — assistante virtuelle du site vitrine ───────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: xpark-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - xpark-network
    restart: unless-stopped

  ayshaa-rag:
    build:
      context: ./AyshaaRAG
      dockerfile: Dockerfile
    container_name: xpark-ayshaa-rag
    ports:
      - "8010:8010"
    environment:
      - AYSHAA_QDRANT_URL=http://qdrant:6333
      - AYSHAA_OLLAMA_URL=http://ollama:11434
      - AYSHAA_LLM_ENABLED=true
      - AYSHAA_MEMORY_DB=/data/ayshaa_memory.db
      - AYSHAA_DATA_DIR=/data
      - AYSHAA_ADMIN_API_KEY=${AYSHAA_ADMIN_API_KEY:-dev-only-key}
      # CORS: list the exact origins the browser uses to reach the gateway.
      # Do NOT use wildcard (*) — Ayshaa handles authenticated requests.
      # http://localhost:8080 = local dev gateway
      # All production traffic arrives same-origin through NGINX, so CORS
      # is not actually triggered for proxied requests. These origins cover
      # direct browser access scenarios and local development.
      - AYSHAA_CORS_ORIGINS=["http://localhost:3001","http://localhost:8080","https://imperfect-civic-cloak.ngrok-free.dev"]
    volumes:
      - ayshaa-data:/data
    depends_on:
      - qdrant
    networks:
      - xpark-network
    restart: unless-stopped

  # LLM local optionnel : docker compose --profile llm up -d ollama
  # puis : docker exec xpark-ollama ollama pull qwen2.5:3b-instruct
  # Sans lui, Ayshaa fonctionne en mode extractif (degradation gracieuse).
  ollama:
    image: ollama/ollama:latest
    container_name: xpark-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - xpark-network
    restart: unless-stopped

networks:
  xpark-network:
    driver: bridge

volumes:
